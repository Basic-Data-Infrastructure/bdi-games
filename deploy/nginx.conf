# nginx runs as an unprivileged user: everything it writes lives in /tmp and
# errors go to the container log stream.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The API logs its own events. An access line per heartbeat and poll would only add log volume.
  access_log off;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # text/event-stream is deliberately absent: compressing it would buffer the live stream.
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  upstream game_api {
    server 127.0.0.1:8787;
    keepalive 16;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://game_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Server-sent events: pass every chunk on immediately and keep the stream open.
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    location = /health {
      proxy_pass http://game_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # Vite puts a content hash in these file names, so they can be cached forever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options nosniff;
      try_files $uri /index.html;
    }
  }
}
