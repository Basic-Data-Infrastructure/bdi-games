name: Deploy

on:
  push:
    branches: [main]
    # A deploy restarts the game server; text-only changes do not need one.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:bundle

  deploy:
    needs: verify
    # Forks without the Azure variables only run the checks above.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      IMAGE: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/bdi-games
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Azure (OIDC, no stored secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the container registry
        run: az acr login --name "$REGISTRY"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out the new image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:$GITHUB_SHA" \
            --output none

      - name: Wait until the new revision is healthy
        run: |
          for attempt in $(seq 1 30); do
            ready=$(az containerapp show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.latestRevisionName == properties.latestReadyRevisionName" \
              --output tsv)
            if [ "$ready" = "true" ]; then break; fi
            echo "Revision not ready yet (attempt $attempt)"
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "::error::The new revision did not become healthy. Check the Container App log stream."
            exit 1
          fi
          fqdn=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "https://$fqdn/health"
          echo "Deployed to https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
